services:
  - type: web
    name: qshield-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qshield-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://quantam-shield.vercel.app,http://localhost:5173

databases:
  - name: qshield-db
    plan: free
    region: oregon
    databaseName: qshield_db
    user: qshield_user
